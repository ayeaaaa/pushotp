server:
  addr: ":8080"
  api_key: ""
storage:
  type: memory
  sqlite:
    path: ./pushotp.db
code:
  length: 6
  ttl: 5m
  cooldown: 60s
  max_attempts: 5
  max_per_hour: 10
issuer:
  enabled: false
  secret: ""
  ttl: 24h
receivers:
  - name: admin
    channel: pushplus
    pushplus:
      token: "your-pushplus-token"
    template: "【{app}】验证码：{code}，{ttl} 内有效。"
  - name: me
    channel: telegram
    telegram:
      bot_token: "123456:ABC"
      chat_id: "123456789"
